<div class="container my-4">
    <h2 class="text-center mb-4">Todos List</h2>
    <table class="table table-bordered table-hover">
      <thead class="thead-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Website</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.id }}</td>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.website }}</td>
          <td class="text-center">
            <button class="btn btn-primary btn-sm mx-1" (click)="viewTodo(user.id)">
              <i class="bi bi-eye"></i> View
            </button>
            <button class="btn btn-success btn-sm mx-1" (click)="editTodo(user.id)">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button class="btn btn-danger btn-sm mx-1" (click)="deleteTodo(user.id)">
              <i class="bi bi-trash"></i> Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

<div class="container mt-4">
    <form [formGroup]="editUserForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input id="name" class="form-control" formControlName="name" />
        <div *ngIf="editUserForm.get('name')?.invalid && editUserForm.get('name')?.touched" class="text-danger">
          Name is required (minimum 3 characters).
        </div>
      </div>
  
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" class="form-control" formControlName="username" />
        <div *ngIf="editUserForm.get('username')?.invalid && editUserForm.get('username')?.touched" class="text-danger">
          Username is required (minimum 3 characters).
        </div>
      </div>
  
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" formControlName="email" />
        <div *ngIf="editUserForm.get('email')?.invalid && editUserForm.get('email')?.touched" class="text-danger">
          Enter a valid email address.
        </div>
      </div>
  
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input id="phone" class="form-control" formControlName="phone" />
        <div *ngIf="editUserForm.get('phone')?.invalid && editUserForm.get('phone')?.touched" class="text-danger">
          Enter a valid phone number.
        </div>
      </div>
  
      <div class="mb-3">
        <label for="website" class="form-label">Website</label>
        <input id="website" class="form-control" formControlName="website" />
        <div *ngIf="editUserForm.get('website')?.invalid && editUserForm.get('website')?.touched" class="text-danger">
          Enter a valid website URL.
        </div>
      </div>
  
      <h4>Address</h4>
      <div formGroupName="address">
        <div class="mb-3">
          <label for="street" class="form-label">Street</label>
          <input id="street" class="form-control" formControlName="street" />
        </div>
  
        <div class="mb-3">
          <label for="suite" class="form-label">Suite</label>
          <input id="suite" class="form-control" formControlName="suite" />
        </div>
  
        <div class="mb-3">
          <label for="city" class="form-label">City</label>
          <input id="city" class="form-control" formControlName="city" />
        </div>
  
        <div class="mb-3">
          <label for="zipcode" class="form-label">Zipcode</label>
          <input id="zipcode" class="form-control" formControlName="zipcode" />
        </div>
      </div>
  
      <h4>Company</h4>
      <div formGroupName="company">
        <div class="mb-3">
          <label for="companyName" class="form-label">Company Name</label>
          <input id="companyName" class="form-control" formControlName="name" />
        </div>
  
        <div class="mb-3">
          <label for="catchPhrase" class="form-label">Catch Phrase</label>
          <input id="catchPhrase" class="form-control" formControlName="catchPhrase" />
        </div>
  
        <div class="mb-3">
          <label for="bs" class="form-label">BS</label>
          <input id="bs" class="form-control" formControlName="bs" />
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="editUserForm.invalid">Submit</button>
    </form>
  </div>
